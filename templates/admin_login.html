<!DOCTYPE html>
<html>
<head>

    <title>Admin Login</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>
<body>

<div class="admin-login">

    <form method="POST">

        <h2>Admin Login</h2>

        <input type="text"
        name="username"
        placeholder="Username">

        <input type="password"
        name="password"
        placeholder="Password">

        <button type="submit">
            Login
        </button>

    </form>

</div>

</body>
</html>
